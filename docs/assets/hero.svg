<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Telegram AI Assistant Bot: booking conversation in Russian, 2 hour reminder and owner digest</title>
  <rect width="960" height="560" rx="18" fill="#0f1b2d"/>
  <rect x="0" y="0" width="960" height="560" rx="18" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12233d"/><stop offset="1" stop-color="#0b1424"/></linearGradient>
  </defs>
  <!-- left tagline -->
  <text x="48" y="74" font-size="28" font-weight="700" fill="#ffffff">Answers.</text>
  <text x="48" y="108" font-size="28" font-weight="700" fill="#ffffff">Books. Reminds.</text>
  <text x="48" y="140" font-size="15" fill="#9db3d0">Telegram assistant</text>
  <text x="48" y="160" font-size="15" fill="#9db3d0">for small businesses</text>
  <g font-size="15" fill="#d6e3f5">
    <text x="48" y="210">FAQ from your own knowledge file</text>
    <text x="48" y="240">EN / RU / HY, detected per message</text>
    <text x="48" y="270">Slots in SQLite, no double booking</text>
    <text x="48" y="300">Reminders 24 h and 2 h before</text>
    <text x="48" y="330">Owner digest and human handoff</text>
  </g>
  <g fill="#2aa3ef"><circle cx="38" cy="205" r="4"/><circle cx="38" cy="235" r="4"/><circle cx="38" cy="265" r="4"/><circle cx="38" cy="295" r="4"/><circle cx="38" cy="325" r="4"/></g>

  <!-- phone -->
  <rect x="300" y="24" width="340" height="512" rx="36" fill="#05090f" stroke="#2b3b55" stroke-width="3"/>
  <rect x="312" y="40" width="316" height="480" rx="26" fill="#17212b"/>
  <rect x="312" y="40" width="316" height="52" rx="26" fill="#212d3b"/>
  <rect x="312" y="66" width="316" height="26" fill="#212d3b"/>
  <circle cx="344" cy="66" r="15" fill="#2aa3ef"/>
  <text x="344" y="71" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">S</text>
  <text x="368" y="62" font-size="14" font-weight="700" fill="#fff">Smile Studio</text>
  <text x="368" y="78" font-size="11" fill="#7f93aa">bot</text>

  <!-- messages -->
  <g font-size="12.5">
    <rect x="404" y="104" width="212" height="40" rx="12" fill="#2b5278"/>
    <text x="416" y="121" fill="#fff">Здравствуйте! Хочу записаться</text>
    <text x="416" y="136" fill="#fff">на чистку зубов на завтра</text>

    <rect x="324" y="154" width="236" height="56" rx="12" fill="#212d3b"/>
    <text x="336" y="172" fill="#e8eef6">Конечно! Выберите время на завтра:</text>
    <rect x="336" y="182" width="48" height="20" rx="6" fill="#2f4358"/><text x="360" y="196" fill="#9ed2ff" text-anchor="middle">10:00</text>
    <rect x="392" y="182" width="48" height="20" rx="6" fill="#2f4358"/><text x="416" y="196" fill="#9ed2ff" text-anchor="middle">11:30</text>
    <rect x="448" y="182" width="48" height="20" rx="6" fill="#2f4358"/><text x="472" y="196" fill="#9ed2ff" text-anchor="middle">15:00</text>

    <rect x="528" y="220" width="88" height="26" rx="12" fill="#2b5278"/>
    <text x="540" y="237" fill="#fff">11:30</text>

    <rect x="324" y="256" width="270" height="72" rx="12" fill="#212d3b"/>
    <text x="336" y="274" fill="#e8eef6">Готово. Чистка зубов, завтра в 11:30.</text>
    <text x="336" y="292" fill="#e8eef6">Имя: Анна, тел.: +374 77 123456</text>
    <text x="336" y="310" fill="#7fe3a3" font-weight="700">Запись подтверждена</text>

    <text x="470" y="352" font-size="11" fill="#6c8199" text-anchor="middle">на следующий день, за 2 часа</text>
    <rect x="324" y="362" width="270" height="92" rx="12" fill="#212d3b"/>
    <text x="336" y="380" fill="#e8eef6">Напоминание: сегодня в 11:30</text>
    <text x="336" y="396" fill="#e8eef6">чистка зубов, Smile Studio.</text>
    <text x="336" y="412" fill="#e8eef6">Вы придёте?</text>
    <rect x="336" y="420" width="116" height="26" rx="8" fill="#2aa3ef"/><text x="394" y="437" fill="#fff" font-weight="700" text-anchor="middle">Подтвердить</text>
    <rect x="460" y="420" width="122" height="26" rx="8" fill="#3a2a30"/><text x="521" y="437" fill="#ff9aa6" font-weight="700" text-anchor="middle">Отменить</text>
  </g>
  <rect x="324" y="474" width="240" height="30" rx="15" fill="#212d3b"/>
  <text x="342" y="493" font-size="12" fill="#6c8199">Сообщение</text>

  <!-- owner digest inset -->
  <rect x="676" y="150" width="244" height="250" rx="16" fill="#101a29" stroke="#2b3b55" stroke-width="2"/>
  <text x="694" y="178" font-size="13" font-weight="700" fill="#ffffff">Owner digest, 20:00</text>
  <line x1="694" y1="188" x2="902" y2="188" stroke="#2b3b55"/>
  <g font-size="12" fill="#d6e3f5">
    <text x="694" y="210" fill="#9db3d0">Today</text>
    <text x="694" y="228">3 bookings, 1 new lead</text>
    <text x="694" y="256" fill="#9db3d0">Tomorrow</text>
    <text x="694" y="274">09:00  Consultation</text>
    <text x="694" y="292">11:30  Cleaning  (confirmed)</text>
    <text x="694" y="310" fill="#ffcf7a">14:00  Whitening  (unconfirmed)</text>
    <text x="694" y="338" fill="#9db3d0">Open handoffs</text>
    <text x="694" y="356">1 waiting for /reply</text>
  </g>
  <rect x="694" y="368" width="96" height="20" rx="10" fill="#1c3b2c"/><text x="742" y="382" font-size="11" fill="#7fe3a3" text-anchor="middle">/export CSV</text>
  <path d="M640 280 C660 280 660 270 676 270" fill="none" stroke="#2aa3ef" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="798" y="432" font-size="11" fill="#6c8199" text-anchor="middle">sent to the admin chat</text>
</svg>
